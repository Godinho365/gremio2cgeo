[project]
name = "patrimonia-backend"
version = "0.1.0"
description = "ERP Patrimonial SaaS - backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "django-environ>=0.11",
    "gunicorn>=22.0",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = [
    # Tetos obrigatórios. Sem eles, uma reconstrução da imagem puxa a versão
    # mais nova e a suíte quebra inteira no setup: o pytest-django 4.13 lê
    # PytestDjangoTestCase._pre_setup_ran_eagerly, que só existe em Django
    # mais novo que o 5.1 usado aqui. Ao subir o Django, revise estes limites.
    "pytest>=8.0,<9",
    "pytest-django>=4.8,<4.13",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "DJ", "C4"]
# UP046/UP047: PEP 695 generics not adopted yet (django-stubs compatibility).
ignore = ["UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "tests.py"]
addopts = "-q --reuse-db"
markers = ["no_pix: roda como se o Mercado Pago não estivesse configurado"]

[tool.setuptools.packages.find]
include = ["config*", "core*", "apps*"]
